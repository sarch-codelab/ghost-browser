[package]
name = "wisp-engine"
version = "0.1.0"
edition = "2024"
description = "Wisp, an experimental HTML layout and paint-list engine."
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0"
base64 = "0.23.1"
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
ego-tree = "0.11"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
scraper = "0.29"
taffy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
