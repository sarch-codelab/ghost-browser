[workspace]
members = ["crates/*"]
# Build only the engine when no package is selected, preserving the previous
# behaviour of `cargo build` inside `wisp/`. Individual crates are still built
# on demand with `-p` (e.g. `cargo build --release -p wisp-agent`).
default-members = ["."]
resolver = "3"

[package]
name = "wisp-engine"
version = "0.1.0"
edition = "2024"
description = "Wisp, an experimental Rust web engine with DOM, CSS, style, layout, paint, JS, and headless agent support."
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0"
base64 = "0.23.1"
ego-tree = "0.11"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
scraper = "0.29"
taffy = "0.15"
serde_json = "1.0"
url = "2.5"
wisp-css = { path = "crates/wisp-css" }
wisp-dom = { path = "crates/wisp-dom" }
wisp-js = { path = "crates/wisp-js" }
wisp-layout = { path = "crates/wisp-layout" }
wisp-net = { path = "crates/wisp-net" }
wisp-paint = { path = "crates/wisp-paint" }
wisp-style = { path = "crates/wisp-style" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
opt-level = 1

[profile.test]
debug = "line-tables-only"

