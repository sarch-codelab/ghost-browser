[package]
name = "wisp-cdp"
version = "0.1.0"
edition = "2024"
description = "Wisp CDP layer: Chrome DevTools Protocol calls and PNG capture for a WebView2 host."
license = "MIT"

[dependencies]
serde_json = "1.0"
wry = { version = "0.57.2", features = ["devtools"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
] }
windows-core = "0.62"
