[package]
name = "wisp-agent"
version = "0.1.0"
edition = "2024"
description = "Headless Wisp engine CLI for agents: no egui, wgpu, wry or WebView2."
license = "MIT"

[[bin]]
name = "wisp-agent"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0"
serde_json = "1.0"
wisp-engine = { path = "../.." }
wisp-mcp = { path = "../wisp-mcp" }
