[package]
name = "ghost"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust desktop browser combining the experimental Wisp engine with WebView2, privacy controls, and tab suspension."
license = "MIT"
repository = "https://github.com/sarch-codelab/ghost-browser"

[features]
default = []
perf = []

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
egui-winit = "0.37.0"
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.35"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
wgpu = "30.0.1"
winit = "0.30"
wry = { version = "0.57.2", features = ["devtools"] }
wisp-cdp = { path = "wisp/crates/wisp-cdp" }
wisp-engine = { path = "wisp" }
wisp-mcp = { path = "wisp/crates/wisp-mcp" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
windows-core = "0.62"
