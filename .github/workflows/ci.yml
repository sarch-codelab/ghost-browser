      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wisp -> wisp/target
          key: ${{ runner.os }}-wisp-cargo-${{ hashFiles('wisp/Cargo.lock') }}

      - name: Check formatting (wisp)
        run: cargo fmt --manifest-path wisp/Cargo.toml --all -- --check

      - name: Clippy (wisp)
        run: |
          if ! out=$(cargo clippy --manifest-path wisp/Cargo.toml --workspace --all-targets --all-features -- -D warnings 2>&1); then
            printf '%s\n' "$out"
            matched=$(printf '%s\n' "$out" | grep -E '(\[91merror|^error|-->)' | head -n 9 || true)
            if [ -z "$matched" ]; then matched=$(printf '%s\n' "$out" | tail -n 8); fi
            printf '%s\n' "$matched" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build (wisp)
        run: cargo build --manifest-path wisp/Cargo.toml --workspace --release --locked

      - name: Run tests (wisp)
        run: |
          if ! out=$(cargo test --manifest-path wisp/Cargo.toml --workspace --locked 2>&1); then
            printf '%s\n' "$out"
            matched=$(printf '%s\n' "$out" | grep -E '(FAILED|panicked at|error\[|\[91merror|^error|-->)' | head -n 9 || true)
            if [ -z "$matched" ]; then matched=$(printf '%s\n' "$out" | tail -n 8); fi
            printf '%s\n' "$matched" | while IFS= read -r line; do
              echo "::error::$line"
            done
