name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (root)
        run: cargo fmt --all -- --check

      - name: Check formatting (wisp)
        run: cargo fmt --manifest-path wisp/Cargo.toml --all -- --check

      - name: Clippy (root)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (wisp)
        run: cargo clippy --manifest-path wisp/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Build (root)
        run: cargo build --release --locked

      - name: Build (wisp)
        run: cargo build --manifest-path wisp/Cargo.toml --workspace --release --locked

      - name: Run tests (root)
        run: cargo test --locked

      - name: Run tests (wisp)
        run: cargo test --manifest-path wisp/Cargo.toml --workspace --locked

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (root)
        run: |
          if ! out=$(cargo fmt --all -- --check 2>&1); then
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -E '^(Diff in|[+-])' | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Check formatting (wisp)
        run: |
          if ! out=$(cargo fmt --manifest-path wisp/Cargo.toml --all -- --check 2>&1); then
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -E '^(Diff in|[+-])' | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Clippy (root)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (wisp)
        run: cargo clippy --manifest-path wisp/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Build (root)
        run: cargo build --release --locked

      - name: Build (wisp)
        run: cargo build --manifest-path wisp/Cargo.toml --workspace --release --locked

      - name: Run tests (root)
        run: cargo test --locked

      - name: Run tests (wisp)
        run: cargo test --manifest-path wisp/Cargo.toml --workspace --locked