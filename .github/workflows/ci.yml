name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path wisp/Cargo.toml --all -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path wisp/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --manifest-path wisp/Cargo.toml --workspace --release --locked

      - name: Run tests
        run: |
          cargo test --locked
          cargo test --manifest-path wisp/Cargo.toml --workspace --locked

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path wisp/Cargo.toml --all -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path wisp/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --manifest-path wisp/Cargo.toml --workspace --release --locked

      - name: Run tests
        run: |
          cargo test --locked
          cargo test --manifest-path wisp/Cargo.toml --workspace --locked